name: SharpLine Daily Research Discovery
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sharpline-daily-discovery
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Discover events
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python daily_scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: sharpline-daily-snapshot
          path: data/latest_scan.json
          if-no-files-found: error
          retention-days: 7
